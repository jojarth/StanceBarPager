name: Package Addon

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package zip
        run: |
          mkdir -p build/StanceBarPager
          cp StanceBarPager.toc StanceBarPager.lua build/StanceBarPager/
          for f in sbp_icon.png readme.md README.md license LICENSE LICENSE.txt; do
            [ -f "$f" ] && cp "$f" build/StanceBarPager/
          done
          cd build
          zip -r ../StanceBarPager-${{ github.ref_name }}-forever.zip StanceBarPager

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: StanceBarPager-${{ github.ref_name }}-forever.zip
